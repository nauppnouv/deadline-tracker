spring.application.name=deadline-tracker
spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3307/deadline}
spring.datasource.username=${DB_USER:deadline}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.file-size-threshold=0
app.attachments.root=${ATTACHMENT_ROOT:${java.io.tmpdir}/deadline-tracker-attachments}
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=12MB
server.max-http-request-header-size=16KB
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.connections.pooling=ERROR

# Runtime key is a private file outside source/release; sender is opt-in.
app.push.enabled=${PUSH_ENABLED:false}
app.push.public-key=${PUSH_PUBLIC_KEY:}
app.push.private-key-file=${PUSH_PRIVATE_KEY_FILE:}
app.push.subject=${PUSH_SUBJECT:}
