<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Nhóm của tôi')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="container"><div class="page-heading"><div><p class="eyebrow">KHÔNG GIAN LÀM VIỆC</p><h1>Nhóm của tôi</h1><p>Một nơi để biết việc cần làm và cùng nhau giữ đúng hạn.</p></div><a class="button" th:href="@{/groups/new}">Tạo nhóm</a></div><section class="empty card" th:if="${#lists.isEmpty(groups)}"><h2>Bắt đầu với nhóm đầu tiên</h2><p>Tạo nhóm đồ án hoặc mở liên kết mời được chia sẻ bởi chủ nhóm.</p><a th:href="@{/groups/new}">Tạo nhóm mới</a></section><section class="group-grid"><article class="card group-card" th:each="group : ${groups}"><span class="badge" th:text="${group.ownerId == actorId ? 'Chủ nhóm' : 'Thành viên'}"></span><h2><a th:href="@{/groups/{id}(id=${group.id})}" th:text="${group.name}"></a></h2><p th:text="${group.description}"></p><a th:href="@{/groups/{id}(id=${group.id})}">Mở nhóm →</a></article></section></main></body></html>
