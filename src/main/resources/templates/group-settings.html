<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Thiết lập nhóm')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="container"><a th:href="@{/groups/{id}(id=${group.id})}">← Về nhóm</a><h1>Thiết lập nhóm</h1><section class="card"><h2>Thông tin nhóm</h2><form th:action="@{/groups/{id}/settings(id=${group.id})}" method="post" th:object="${form}"><div class="alert" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div><label for="name">Tên nhóm</label><input id="name" th:field="*{name}" maxlength="100" required><label for="description">Mô tả</label><textarea id="description" th:field="*{description}" maxlength="1000" rows="3"></textarea><button type="submit">Lưu thông tin</button></form></section><section class="card"><h2>Mời thành viên</h2><p>Mỗi liên kết thêm được một người và có hiệu lực trong 24 giờ. Tạo liên kết riêng cho từng người.</p><form th:action="@{/groups/{id}/invitations(id=${group.id})}" method="post"><button type="submit">Tạo liên kết mời</button></form><ul class="invitation-list"><li th:each="invitation : ${invitations}"><span>Đến <strong th:text="${time.format(invitation.expiresAt)}"></strong></span><span th:if="${invitation.usedAt != null}" class="badge">Đã dùng</span><span th:if="${invitation.revokedAt != null}" class="badge">Đã thu hồi</span><form th:if="${invitation.usedAt == null and invitation.revokedAt == null}" th:action="@{/groups/{g}/invitations/{i}/revoke(g=${group.id},i=${invitation.id})}" method="post"><button class="secondary" type="submit">Thu hồi</button></form></li></ul></section></main></body></html>
