<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Lời mời tham gia nhóm')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="container"><p class="eyebrow">CÙNG NHAU HOÀN THÀNH ĐỒ ÁN</p><h1 th:text="${invite.groupName}"></h1><p>Người mời: <strong th:text="${invite.invitedBy}"></strong></p><p>Hiệu lực đến <strong th:text="${time.format(invite.expiresAt)}"></strong> (giờ Việt Nam).</p><section th:if="${invite.owner}"><h2>Chia sẻ lời mời</h2><p>Sao chép địa chỉ trang này từ thanh địa chỉ trình duyệt và gửi cho một thành viên.</p><label for="invitation-link">Liên kết mời</label><input id="invitation-link" readonly th:value="${invitationPath}"><button type="button" data-copy-invite>Sao chép liên kết</button><p id="copy-result" role="status" aria-live="polite"></p></section><p class="notice" th:if="${invite.alreadyMember}">Bạn đã là thành viên. Liên kết chưa bị sử dụng khi bạn mở trang này.</p><form th:unless="${invite.alreadyMember}" th:action="${invitationPath}" method="post"><button type="submit">Xác nhận tham gia nhóm</button></form><a th:if="${invite.alreadyMember}" th:href="@{/groups/{id}(id=${invite.groupId})}">Mở nhóm</a></main><script defer th:src="@{/js/app.js}"></script></body></html>
