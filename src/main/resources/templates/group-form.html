<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Tạo nhóm')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="container"><a th:href="@{/groups}">← Nhóm của tôi</a><h1>Tạo nhóm đồ án</h1><form th:action="@{/groups}" method="post" th:object="${form}"><div class="alert" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div><label for="name">Tên nhóm</label><input id="name" th:field="*{name}" maxlength="100" required><small th:errors="*{name}"></small><label for="description">Mô tả nhóm <span class="muted">(không bắt buộc)</span></label><textarea id="description" th:field="*{description}" maxlength="1000" rows="4"></textarea><small th:errors="*{description}"></small><button type="submit">Tạo nhóm</button></form></main></body></html>
