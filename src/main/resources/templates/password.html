<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đổi mật khẩu')}"></head>
<body><header th:replace="~{fragments :: header}"></header><main class="auth-shell"><section class="card"><h1>Đổi mật khẩu</h1><p>Sau khi đổi, các phiên cũ sẽ hết hiệu lực và bạn cần đăng nhập lại.</p><p class="alert" role="alert" th:if="${message}" th:text="${message}"></p><form th:action="@{/password}" method="post"><label for="currentPassword">Mật khẩu hiện tại hoặc mật khẩu tạm</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required><label for="newPassword">Mật khẩu mới</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" required><label for="confirmPassword">Xác nhận mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" required><button type="submit">Lưu và đăng nhập lại</button></form></section></main></body></html>
