<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký')}"></head>
<body><main class="auth-shell"><section class="card"><p class="eyebrow">BẮT ĐẦU CÙNG NHÓM</p><h1>Tạo tài khoản</h1><p class="alert" role="alert" th:if="${message}" th:text="${message}"></p><form th:action="@{/register}" method="post"><input th:if="${next}" type="hidden" name="next" th:value="${next}"><label for="username">Tên tài khoản</label><input id="username" name="username" th:value="${username}" autocomplete="username" minlength="3" maxlength="30" required><small>3–30 ký tự a-z, số, dấu chấm, gạch dưới hoặc gạch ngang.</small><label for="displayName">Tên hiển thị</label><input id="displayName" name="displayName" th:value="${displayName}" autocomplete="nickname" maxlength="80" required><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required><small>8–128 ký tự; có thể dùng một cụm từ dài. Mật khẩu không bị tự bỏ khoảng trắng.</small><button type="submit">Tạo tài khoản</button></form><p>Đã có tài khoản? <a th:href="@{/login(next=${next})}">Đăng nhập</a></p></section></main></body></html>
