<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Công việc của nhóm')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="container"><a th:href="@{/groups}">← Nhóm của tôi</a><div class="page-heading"><div><p class="eyebrow">NHÓM ĐỒ ÁN</p><h1 th:text="${group.name}"></h1><p th:text="${group.description}"></p></div><a class="button secondary" th:if="${owner}" th:href="@{/groups/{id}/settings(id=${group.id})}">Thiết lập &amp; mời thành viên</a></div><section class="card"><h2>Thành viên</h2><ul class="member-list"><li th:each="person : ${members}"><span th:text="${person.displayName}"></span><span class="badge" th:if="${person.owner}">Chủ nhóm</span></li></ul></section><section class="card"><h2>Công việc</h2><p th:if="${#lists.isEmpty(tasks)}">Nhóm chưa có công việc.</p><ul><li th:each="task : ${tasks}"><span th:text="${task.title}"></span> · <span th:text="${time.status(task.status)}"></span></li></ul></section></main></body></html>
