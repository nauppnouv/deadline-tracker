<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng nhập')}"></head>
<body><main class="auth-shell"><section class="card"><p class="eyebrow">DEADLINE TRACKER</p><h1>Chào mừng trở lại</h1><p>Theo dõi công việc và tiến độ cùng nhóm đồ án.</p><p class="alert" role="alert" th:if="${param.error}">Thông tin đăng nhập không đúng. Vui lòng thử lại.</p><p class="notice" th:if="${param.registered}">Đã tạo tài khoản. Bạn có thể đăng nhập.</p><p class="notice" th:if="${param.changed}">Đã đổi mật khẩu. Vui lòng đăng nhập lại.</p><p class="notice" th:if="${param.logout}">Bạn đã đăng xuất.</p><form th:action="@{/login}" method="post"><label for="username">Tên tài khoản</label><input id="username" name="username" autocomplete="username" maxlength="30" required><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required><button type="submit">Đăng nhập</button></form><p>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p></section></main></body></html>
