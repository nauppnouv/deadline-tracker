<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thông tin công việc')}">
</head>
<body>
<header th:replace="~{fragments :: header}">
</header>
<main class="container">
<a class="back-link" th:href="@{/groups/{id}(id=${group.id})}">← Về nhóm</a>
<section class="card form-card">
<p class="eyebrow" th:text="${group.name}">
</p>
<h1 th:text="${editing ? 'Chỉnh sửa công việc' : 'Tạo công việc'}">
</h1>
<form th:object="${form}" th:action="${editing ? '/groups/' + group.id + '/tasks/' + task.id + '/edit' : '/groups/' + group.id + '/tasks'}" method="post">
<input type="hidden" th:field="*{version}">
<div class="alert" role="alert" th:if="${#fields.hasAnyErrors()}">
<p th:each="error : ${#fields.allErrors()}" th:text="${error}">
</p>
</div>
<label for="title">Tên công việc</label>
<input id="title" th:field="*{title}" maxlength="150" required aria-describedby="title-error">
<small class="field-error" id="title-error" th:errors="*{title}">
</small>
<label for="description">Mô tả <span class="muted">(không bắt buộc)</span>
</label>
<textarea id="description" th:field="*{description}" maxlength="2000" rows="5" aria-describedby="description-error">
</textarea>
<small class="field-error" id="description-error" th:errors="*{description}">
</small>
<div class="form-grid">
<div>
<label for="assigneeId">Người phụ trách</label>
<select id="assigneeId" th:field="*{assigneeId}" th:disabled="${completed}" required aria-describedby="assignee-error">
<option value="">Chọn thành viên</option>
<option th:each="person : ${members}" th:value="${person.id}" th:text="${person.displayName}">
</option>
</select>
<input th:if="${completed}" type="hidden" name="assigneeId" th:value="${form.assigneeId}">
<small class="field-error" id="assignee-error" th:errors="*{assigneeId}">
</small>
</div>
<div>
<label for="dueAt">Hạn nộp (giờ Việt Nam)</label>
<input id="dueAt" type="datetime-local" th:field="*{dueAt}" th:readonly="${completed}" required aria-describedby="due-error">
<small class="field-error" id="due-error" th:errors="*{dueAt}">
</small>
</div>
</div>
<p class="notice" th:if="${completed}">Người phụ trách cần mở lại công việc trước khi bạn đổi hạn hoặc giao lại.</p>
<p class="notice" th:if="${stale}">Nội dung bạn vừa nhập vẫn ở đây. Hãy sao chép phần cần giữ rồi tải lại dữ liệu mới trước khi sửa tiếp.</p>
<div class="actions">
<button type="submit" th:disabled="${stale}">Lưu công việc</button>
<a th:if="${stale}" th:href="@{/groups/{g}/tasks/{t}/edit(g=${group.id},t=${task.id})}">Tải lại công việc</a>
<a th:href="@{/groups/{id}(id=${group.id})}">Về nhóm</a>
</div>
</form>
</section>
</main>
<script defer th:src="@{/js/app.js}">
</script>
</body>
</html>
