name: deadline-tracker
services:
  db:
    image: mariadb@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_DATABASE: deadline
      MARIADB_USER: deadline
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set a local DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate local DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports: ["127.0.0.1:${DB_PORT:-3307}:3306"]
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
  app:
    image: deadline-tracker:local
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mariadb://db:3306/deadline
      DB_USER: deadline
      DB_PASSWORD: ${DB_PASSWORD:?Set a local DB_PASSWORD}
      TZ: UTC
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    restart: unless-stopped
volumes:
  database:
